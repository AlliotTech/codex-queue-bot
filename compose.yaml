name: codex-queue-bot

services:
  codex-queue-bot:
    image: ${CODEX_QUEUE_BOT_IMAGE:-ghcr.io/alliottech/codex-queue-bot:latest}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config.json:/app/config.json:ro
      - ./prompts.txt:/app/prompts.txt:ro
