name: codex-queue-bot

services:
  codex-queue-bot:
    image: ${CODEX_QUEUE_BOT_IMAGE:-ghcr.io/alliottech/codex-queue-bot:latest}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CODEX_QUEUE_MASTER_KEY: ${CODEX_QUEUE_MASTER_KEY:?set CODEX_QUEUE_MASTER_KEY to Base64-encoded 32 bytes}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - codex-queue-data:/app/data
      - ./prompts.txt:/app/prompts.txt:ro

volumes:
  codex-queue-data:
